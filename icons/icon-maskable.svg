<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="1" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.35" stop-color="#06b6d4"/>
      <stop offset="0.6" stop-color="#10b981"/>
      <stop offset="0.8" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 满版背景（系统会按各平台形状裁切）；主体收缩到中央 ~70% 安全区 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path d="M120 118 V392 H400" fill="none" stroke="#5b7499" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <path d="M138 150 C 210 215, 280 300, 392 350" fill="none" stroke="url(#heat)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="236" cy="236" r="30" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.45"/>
    <circle cx="236" cy="236" r="17" fill="#0b1220" stroke="#fbbf24" stroke-width="9"/>
  </g>
</svg>
